name: Insights Weekly Auto-Draft

# Runs every Monday morning. Drafts one Insights article using the
# Anthropic API, runs it through the 11 quality gates, opens a
# feature branch on push, and reports the PR URL.
#
# The 60-second human-gate review still happens — this workflow opens
# the PR, the user (Aaron) reviews and merges, Cloudflare Pages
# auto-deploys.
#
# Required repository secret:
#   ANTHROPIC_API_KEY — your Anthropic API key (sk-ant-...)
#
# Optional repository variable:
#   ANTHROPIC_MODEL — override the default model. Defaults to
#                     claude-opus-4-5 if unset.

on:
  schedule:
    # 13:47 UTC every Monday:
    #   8:47 AM CDT (summer)  — within early morning Central US
    #   7:47 AM CST (winter)  — still pre-business-hours Central US
    # Off-minute (:47) avoids the :00 / :30 fleet pile-up.
    - cron: '47 13 * * 1'
  # Allow manual triggering from the Actions tab for testing or
  # ad-hoc drafting.
  workflow_dispatch:
    inputs:
      slug:
        description: 'Force a specific cluster slug (optional). Leave blank to pick from the schedule.'
        required: false
        type: string
      dry_run:
        description: 'Dry run — produce the article and validate, but skip the git push'
        required: false
        type: boolean
        default: false

# contents:write     — push the auto-draft/* branch
# pull-requests:write — auto-open the PR so the user gets a normal
#                       GitHub notification (email + mobile push +
#                       web UI inbox). The human-gate review still
#                       happens at MERGE time, not PR-open time;
#                       opening the PR is just the handoff signal.
permissions:
  contents: write
  pull-requests: write

# Prevent overlapping runs if a manual trigger fires while the
# scheduled run is still working.
concurrency:
  group: insights-auto-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # We need a token that can push. The default GITHUB_TOKEN
          # has contents:write per the permissions block above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-anthropic-v1

      - name: Install anthropic SDK
        run: pip install --upgrade anthropic

      - name: Configure git identity
        run: |
          git config user.name  "Insights Auto-Draft Bot"
          git config user.email "insights-bot@midwestcncservices.com"

      - name: Run auto-draft orchestrator
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:   ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-5' }}
          AUTO_DRAFT_SLUG:   ${{ inputs.slug }}
          AUTO_DRAFT_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          GITHUB_ACTIONS: 'true'
        run: python3 scripts/insights_auto_draft.py

      - name: Open PR for the auto-draft branch
        # Only run when a real branch was pushed (skip on dry-run,
        # on "nothing to draft" runs, and on validation-fail runs).
        if: success() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" = "main" ] || [ -z "$BRANCH" ]; then
            echo "No auto-draft branch was created (nothing to draft this run)."
            exit 0
          fi
          SLUG="${BRANCH#auto-draft/}"
          # Pull the article title from the markdown frontmatter for a
          # readable PR title.
          ARTICLE_PATH=$(find src/content/insights -name "${SLUG}.md" -not -path "*_drafts*" | head -1)
          TITLE="Insights: $SLUG"
          if [ -n "$ARTICLE_PATH" ]; then
            FRONT_TITLE=$(grep -m1 '^title:' "$ARTICLE_PATH" | sed 's/^title: *"\(.*\)"$/\1/')
            if [ -n "$FRONT_TITLE" ]; then
              TITLE="Insights: $FRONT_TITLE"
            fi
          fi

          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<'EOF'
          ## Auto-drafted by the weekly Insights workflow

          This PR was opened automatically by `.github/workflows/insights-auto-draft.yml`.
          All 11 quality gates passed. The 60-second human-gate review
          still applies before merging.

          ### 60-second human-gate checklist

          **Voice (15 sec)**
          - [ ] Sounds like Ken (measured, plain, no hype, no exclamation points)
          - [ ] No "Have you ever wondered..." or similar marketing openers

          **Editorial constraints (15 sec)**
          - [ ] Search for banned phrases: `photo-verified`, `factory-trained`,
                `24/7`, `ISO`, `flat-rate`, `transparent pricing`,
                `warranty`, `same-day`, `guaranteed`
          - [ ] Named manufacturers framed as regional context, not customers
          - [ ] All specific numbers defensible (hedged where data isn't real)

          **Substance (20 sec)**
          - [ ] Would Ken roll his eyes at any claim? If yes, fix before merge.
          - [ ] Internal links land in-context (not as a "Related Posts" footer)
          - [ ] Key Takeaways block reads as quotable

          **GEO / quotability (10 sec)**
          - [ ] Each H2 opens with a definitional sentence
          - [ ] Sources & references tail present

          ### When you're ready

          Merge this PR. Cloudflare Pages deploys in ~2 min.

          **Optional v2 edit pass:** when Ken has 5 minutes, edit the
          markdown in `src/content/insights/{pillar}/{slug}.md` directly
          with his actual specifics (real pricing ranges, named customer
          scenarios, bench photo references), commit, push, Cloudflare
          re-deploys.

          ---

          *Generated by `scripts/insights_auto_draft.py`. To pause the
          weekly automation, see `docs/insights-auto-draft-setup.md`.*
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$BODY_FILE" \
            --label "insights-auto-draft" || \
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$BODY_FILE"

          PR_URL=$(gh pr view "$BRANCH" --json url --jq .url)
          echo "PR opened: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
        id: pr

      - name: Summarize run in Actions UI
        if: always()
        run: |
          echo "## Insights Auto-Draft" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "src/content/insights/_drafts" ]; then
            REVIEW=$(ls src/content/insights/_drafts/*.review.md 2>/dev/null | head -1 || true)
            if [ -n "$REVIEW" ]; then
              echo "**Status: validation failed.** Review file:" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "\`$REVIEW\`" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Check the job log above for the specific gate failures." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" != "main" ] && [ -n "$BRANCH" ]; then
            echo "**Branch pushed:** \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${{ steps.pr.outputs.pr_url }}" ]; then
              echo "**PR opened automatically:** ${{ steps.pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "You should have a GitHub email + mobile notification about this PR." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "[Open PR manually →](https://github.com/${{ github.repository }}/pull/new/$BRANCH)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
